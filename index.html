  --warn:#8a6100; --warn-soft:#fbf0d3; --bad:#d64545; --bad-soft:#fbe4e2; --ok:#1f9d6b; --ok-soft:#dff2e8;
  --display:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sans:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:Consolas,"Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1726; --surface:#1b2637; --ink:#e6edf5; --muted:#9fb2c4; --line:#2c3b4f;
  --accent:#7fb4e0; --accent-ink:#0e1726; --accent-soft:#213048; --accent2:#8fc4e8;
  --warn:#e0a325; --warn-soft:#3a2d0c; --bad:#ff8f86; --bad-soft:#3a1816; --ok:#4cc995; --ok-soft:#10301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1726; --surface:#1b2637; --ink:#e6edf5; --muted:#9fb2c4; --line:#2c3b4f;
  --accent:#7fb4e0; --accent-ink:#0e1726; --accent-soft:#213048; --accent2:#8fc4e8;
  --warn:#e0a325; --warn-soft:#3a2d0c; --bad:#ff8f86; --bad-soft:#3a1816; --ok:#4cc995; --ok-soft:#10301f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0}
.app{max-width:1180px;margin:0 auto;padding-block:20px 56px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-bottom:22px;padding:22px clamp(16px,3vw,28px);border-radius:14px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(100deg,var(--hero-1),var(--hero-2))}
header.top::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px 260px at 90% -20%,rgba(255,255,255,.16),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 2px,transparent 2px 34px)}
header.top>*{position:relative;z-index:1}
header.top img{width:48px;height:48px;flex:none;border-radius:10px;background:#fff;padding:3px}
.inputpre{position:relative}.inputpre>span{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);font-weight:700;pointer-events:none}.inputpre>input{padding-left:30px;width:100%}
.themebtn{margin-left:auto;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:8px 14px;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}
.themebtn:hover{background:rgba(255,255,255,.26)}
.themebtn:focus-visible{outline:2px solid #fff;outline-offset:2px}
:root[data-theme="light"]{color-scheme:light}
.htext{display:flex;flex-direction:column;gap:2px;min-width:0}
header.top h1{font-family:var(--display);font-size:clamp(1.15rem,2.6vw,1.55rem);font-weight:700;margin:0;text-wrap:balance}
header.top p{margin:0;color:rgba(255,255,255,.82);font-size:.9rem}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
nav#rail{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;gap:2px;padding-top:4px}
.rail-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.rail-item:hover:not(:disabled){background:var(--accent-soft)}
.rail-item:disabled{color:var(--muted);cursor:not-allowed;opacity:.65}
.rail-item.cur{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent)}
.dot{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:600;border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.rail-item.done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.rail-item.cur .dot{border-color:var(--accent);color:var(--accent)}
.rail-item.done.cur .dot{color:var(--surface)}
.rail-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:0 10px 10px}
.rail-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--hero-2),var(--accent2));transition:width .3s}
.rail-extra{margin:12px 10px 0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
main#main{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px clamp(16px,3vw,28px)}
.eyebrow{font-family:var(--mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 4px}
.panel h2{font-family:var(--display);margin:0 0 6px;font-size:1.3rem;font-weight:600;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;max-width:68ch}
.help{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin:0 0 18px;font-size:.9rem;max-width:80ch}
.help b{font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px 16px}
.grid .wide{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:500;font-size:.88rem}
.field label .req{color:var(--bad)}
.field .hint{font-size:.8rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[readonly]{color:var(--muted);background:transparent}
.mono,input.mono,textarea.mono{font-family:var(--mono);font-size:.85rem}
.seg{display:flex;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.seg button{border:0;background:var(--bg);color:var(--ink);font:inherit;padding:7px 16px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn{font:inherit;font-weight:500;border-radius:8px;padding:9px 18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.small{padding:5px 11px;font-size:.85rem}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0;text-decoration:underline}
.nav{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.missing{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 14px;font-size:.88rem;margin-top:16px}
.missing ul{margin:4px 0 0;padding-left:18px}
.ok-box{background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 14px;font-size:.88rem;margin-top:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card h3{margin:0 0 12px;font-size:1rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.derived{font-family:var(--mono);font-size:.82rem;color:var(--muted);margin-top:10px;overflow-wrap:anywhere}
.derived b{color:var(--ink);font-weight:500}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--bg);font-weight:600;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td input,td select{padding:5px 7px;font-size:.85rem;min-width:110px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.chip{background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.tile{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.8rem;color:var(--muted)}
.tile.good b{color:var(--ok)} .tile.warnt b{color:var(--warn)}
.file-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0}
details{border:1px solid var(--line);border-radius:8px;padding:8px 14px;margin:0 0 14px}
summary{cursor:pointer;font-weight:500}
pre{font-family:var(--mono);font-size:.8rem;background:var(--bg);border-radius:8px;padding:10px 12px;overflow-x:auto;margin:8px 0}
.dl{display:flex;flex-wrap:wrap;gap:12px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.dl div{flex:1 1 260px;min-width:0}
.dl strong{display:block}
.btn.go{display:block;width:100%;background:#1a8a5c;color:#fff;border:0;font-weight:600;font-size:1.05rem;padding:14px}.btn.go:hover:not(:disabled){background:#157550}.btn.go:disabled{opacity:.6}
.hint.ok{color:var(--ok);font-weight:600}.hint.bad{color:var(--bad);font-weight:600}
#unused{padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.dl span{font-size:.85rem;color:var(--muted)}
.check{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:6px}
.check li{display:flex;gap:10px;align-items:baseline}
.check .tick{flex:none;width:18px;height:18px;border-radius:50%;background:var(--ok);color:var(--surface);display:inline-grid;place-items:center;font-size:.7rem;transform:translateY(3px)}
ol.steps{padding-left:20px;display:grid;gap:8px}
ol.steps>li{min-width:0}
pre{max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);gap:14px}
  nav#rail{position:static;flex-direction:row;flex-wrap:wrap;gap:4px}
  .rail-item{width:auto;padding:4px}
  .rail-item .lbl{display:none}
  .rail-item.cur .lbl{display:inline;font-weight:600}
  .rail-bar{flex-basis:100%;margin:0 0 4px}
  .rail-extra{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>

<script>
'use strict';
/* ============ utilidades ============ */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') e.className=v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k==='html') e.innerHTML=v;
    else if (v===true) e.setAttribute(k,'');
    else if (v!==false && v!=null) e.setAttribute(k,v);
  }
  for (const c of kids.flat(Infinity)){ if (c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
/* replaceChildren ignora null/false (evita que aparezca el texto "null") */
(function(){ const rc=Element.prototype.replaceChildren; Element.prototype.replaceChildren=function(...a){ return rc.apply(this,a.filter(x=>x!=null&&x!==false)); }; })();
const toast = (msg) => { const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3500); };
const norm = s => String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const upper = s => String(s||'').trim().toUpperCase();
const safeName = s => String(s||'').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,' ') || 'cliente';

/* ============ estado ============ */
const SIZE_OLT = () => ({franq:'', marca:'ZTE', modelo:'', dominio:'', nombre:'', integracion:'', version:'', apikey:'', sn:'', barriosModo:'TODOS', barrios:''});
const SIZE_PLAN = () => ({franq:'', plan:'', tipo:'', megas:'', profile:''});
function freshState(){ return {
  empresa:{nombre:'',pais:'Colombia',lider:'',cargo:'',telefono:'',correo:'',analista:''},
  licencia:{saeplusDominio:'NO',user:'ingenieria@catvnetworkla.com',pass:'',ip:'104.198.137.114',codigo:'',expira:'',resp:''},
  params:{franquicias:''}, pf:{},
  olts:[SIZE_OLT()],
  ordenes:[], ordenesKey:'', ordenesOk:false,
  planes:[SIZE_PLAN()],
  migr:{skip:false, res:null},
  done:{}, step:0
};}
let S = freshState();
const franquicias = () => [...new Set(S.params.franquicias.split('\n').map(s=>s.trim()).filter(Boolean))];
/* parámetros por franquicia (agencia) */
const PF_DEF = () => ({prInst:'NO',prCorte:'NO',prRecon:'NO',tipoServ:'INTERNET',reconAuto:'NO',msg:'NO CREAR',montoMin:'NO',montoPct:'NO',valorMin:'',reconValor:'',reconAplica:'NO APLICA',cobroEn:'NO APLICA'});
const PF_SEED = () => { const d=PF_DEF(), o=S.params||{}; Object.keys(d).forEach(k=>{ if(o[k]!==undefined&&o[k]!=='')d[k]=o[k]; }); if(/^IGUAL/.test(d.reconAplica)&&o.reconAplica===undefined)d.reconAplica='NO APLICA'; return d; };
const pfOf = n => { S.pf=S.pf||{}; const k=String(n||'').trim(); if(!S.pf[k]){ const first=franquicias().map(x=>S.pf[x]).find(Boolean); S.pf[k]=first?{...first}:PF_SEED(); } return S.pf[k]; };
const svOf = t => t==='INTERNET'?['INTERNET GPON']:t==='TELEVISION'?['TV GPON']:['INTERNET GPON','TV GPON'];
const serviciosDe = f => svOf(pfOf(f).tipoServ);
const servicios = () => { const u=new Set(); franquicias().forEach(f=>serviciosDe(f).forEach(x=>u.add(x))); return ['INTERNET GPON','TV GPON'].filter(x=>u.has(x)); };
const svGroups = () => { const g=new Map(); franquicias().forEach(f=>{ const sv=serviciosDe(f), k=sv.join('|'); if(!g.has(k))g.set(k,{sv,fr:[]}); g.get(k).fr.push(f); }); return [...g.values()]; };
const svResumen = () => { const g=svGroups(); return g.length<=1?`Franquicias: ${franquicias().join(', ')} · Servicios: ${(g[0]?g[0].sv:[]).join(' + ')}`:`Franquicias: ${franquicias().map(f=>`${f} (${serviciosDe(f).join(' + ')})`).join(', ')}`; };
const money = v => { const n=parseFloat(String(v).replace(/[^\d.]/g,'')); return v!==''&&v!=null&&isFinite(n)?'$ '+n.toLocaleString('es-CO'):''; };
const oltDeF = f => S.olts.find(o=>upper(o.franq)===upper(f));
const subdominio = d => { d=String(d||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/\/.*$/,''); const m=d.match(/^([a-z0-9-]+)\.smartolt\.com$/); return m?m[1].toUpperCase():''; };
const nombreIntegracion = o => { const c=String(o.integracion||'').trim(); if(c)return c; return (o.nombre&&o.franq)?`SMARTOLT - ${upper(o.franq)} - ${upper(o.nombre)}`:''; };
const draftKey='smartolt-config-draft-v1';
function saveDraft(){ try{ const c=JSON.parse(JSON.stringify({...S,migr:{skip:S.migr.skip,res:null}})); c.licencia.pass=''; localStorage.setItem(draftKey,JSON.stringify(c)); }catch(e){} }
function loadDraft(){ try{ const j=localStorage.getItem(draftKey); if(j){ const d=JSON.parse(j); S={...freshState(),...d}; } }catch(e){} }

/* ============ campos reutilizables ============ */
let uid=0;
function field(o){ // {label, obj, key, type, opts, hint, req, id, ph, ro, cls, ta}
  const id=o.id; let el;
  const val = o.obj[o.key] ?? '';
  if (o.type==='select'){
    el=h('select',{id}, (o.opts||[]).map(v=>{const [value,text]=Array.isArray(v)?v:[v,v]; return h('option',{value},text);}));
    el.value=val;
  } else if (o.type==='textarea'){

let railRefs=[];
function drawRail(){
  const rail=$('#rail'); railRefs=[];
  const bar=h('div',{class:'rail-bar',role:'progressbar','aria-valuemin':0,'aria-valuemax':STEPS.length-1},h('i'));
  const items=STEPS.map((s,i)=>{ const dot=h('span',{class:'dot'}); const b=h('button',{type:'button',class:'rail-item',onclick:()=>go(i)},dot,h('span',{class:'lbl'},s.short)); railRefs.push({b,dot}); return b; });

  updateRail();
}
function updateRail(){
  const bar=$('#rail .rail-bar'); if(!bar||!railRefs.length)return;
  const n=STEPS.filter((s,i)=>i<STEPS.length-1&&S.done[s.id]).length;
  bar.setAttribute('aria-valuenow',n); bar.firstChild.style.width=(n/(STEPS.length-1)*100)+'%';
  STEPS.forEach((s,i)=>{ const {b,dot}=railRefs[i]; b.className='rail-item'+(S.step===i?' cur':'')+(S.done[s.id]?' done':''); b.disabled=!unlocked(i);
    if(S.step===i)b.setAttribute('aria-current','step'); else b.removeAttribute('aria-current'); dot.textContent=S.done[s.id]?'✓':String(i+1); });
}
function go(i){ S.step=i; saveDraft(); drawAll(); scrollTo({top:0}); }
function drawAll(){
  drawRail();
  const st=STEPS[S.step], last=S.step===STEPS.length-1;
  const body=h('div',{id:'stepbody'});
  const miss=h('div',{id:'miss'});
  const back=S.step>0?h('button',{type:'button',class:'btn',onclick:()=>go(S.step-1)},'← Atrás'):h('span');
  const nextB=last?h('span'):h('button',{type:'button',class:'btn primary',onclick:()=>{ if(st.check().length)return; S.done[st.id]=true; go(S.step+1); }},S.step===STEPS.length-2?'Revisar y descargar →':'Continuar →');
  const navb=h('div',{class:'nav'},back,nextB);
  const panel=h('section',{class:'panel'},
    h('p',{class:'eyebrow'},`Paso ${S.step+1} de ${STEPS.length}`), h('h2',null,st.title), body, miss, navb);
  $('#main').replaceChildren(panel);
  window._miss=miss; window._next=nextB;
  body.append(...[].concat(st.render()).filter(Boolean)); refresh();
}
function refresh(){
  const st=STEPS[S.step], m=st.check(), last=S.step===STEPS.length-1;
  const miss=window._miss; if(!miss) return;
  miss.replaceChildren();
  if(m.length && !last) miss.append(h('div',{class:'missing'},'Para continuar falta:',h('ul',null,m.map(x=>h('li',null,x)))));
  else if(!last) miss.append(h('div',{class:'ok-box'},'Todo listo en este paso. Puede continuar.'));
  if(m.length) S.done[st.id]=false;
  if(window._next&&window._next.tagName==='BUTTON')window._next.disabled=m.length>0;
  updateRail();
}

/* ============ paso 8: migración ============ */
function decodeBuf(buf){ try{ return new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ return new TextDecoder('windows-1252').decode(buf); } }
function parseCSV(text){ if(text.charCodeAt(0)===0xFEFF)text=text.slice(1); const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"'&&f==='') q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n')i++; row.push(f);f='';rows.push(row);row=[]; }
    else f+=c; }
  if(f!==''||row.length){row.push(f);rows.push(row);} return rows.filter(r=>!(r.length===1&&r[0]==='')); }
const outField = v => /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
function cleanText(s,allowed){ s=String(s==null?'':s).replace(/\t/g,'').replace(/ /g,' ').normalize('NFD').replace(/[̀-ͯ]/g,''); s=s.replace(allowed,''); return s.replace(/\s+/g,' ').trim(); }
const cleanName = s => cleanText(s,/[^A-Za-z0-9 _-]/g);
const HDR={abonado:['NABONADO','NUMEROABONADO','NROABONADO','ABONADO','NUMABONADO'],doc:['DOCUMENTO','CEDULA','IDENTIFICACION'],sn:['SERIALSN','SERIAL','SN','ONUSN','SERIALONU'],nombre:['NOMBRE','NOMBRES'],apellido:['APELLIDO','APELLIDOS']};
const normaliza = t => String(t).normalize('NFD').replace(/[̀-ͯ]/g,'');
function readDataMigrada(buf){
  const wb=XLSX.read(buf,{type:'array'}); const names=wb.SheetNames;
  const toAoa=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
  // Formato del migrador (CSV MIGRACION SMARTOLT v1): primera hoja con columnas "ONU SN" y "NEW NAME"
  const first=toAoa(names[0]); let ni=-1,iS=-1,iN=-1;
  for(let r=0;r<Math.min(10,first.length)&&ni<0;r++){ const a=first[r].map(norm); const x=a.indexOf('ONUSN'), y=a.indexOf('NEWNAME'); if(x>=0&&y>=0){ni=r;iS=x;iN=y;} }
  if(ni>=0){
    const rows=first.slice(ni+1).map(r=>({sn:String(r[iS]??'').trim(),newName:String(r[iN]??'').trim()})).filter(r=>r.sn||r.newName);
    return {mode:'nn',rows,sheetName:names[0]};
  }
  // Formato de Implementación: hoja DATA MIGRADA (el NEW NAME se arma aquí)
  const pick=names.find(n=>norm(n)==='DATAMIGRADA'); const sheetName=pick||names[0]; const aoa=pick?toAoa(pick):first;
  let hi=-1,idx={};
  for(let r=0;r<Math.min(10,aoa.length);r++){ const m={}; aoa[r].forEach((c,ci)=>{ const n=norm(c); for(const [k,list] of Object.entries(HDR)) if(list.includes(n)&&m[k]==null)m[k]=ci; }); if(Object.keys(m).length>=3&&Object.keys(m).length>Object.keys(idx).length){hi=r;idx=m;} }
  const missing=['abonado','doc','sn','nombre'].filter(k=>idx[k]==null);
  if(hi<0||missing.length) return {error:`En la primera hoja del Excel no encontré las columnas "ONU SN" y "NEW NAME" (ni las de DATA MIGRADA: N° ABONADO, DOCUMENTO, NOMBRE, APELLIDO, SERIAL / SN). Revise los encabezados.`};
  const g=(r,k)=>idx[k]==null?'':String(r[idx[k]]??'').trim();
  const rows=aoa.slice(hi+1).map(r=>({abonado:g(r,'abonado'),doc:g(r,'doc'),sn:g(r,'sn'),nombre:g(r,'nombre'),apellido:g(r,'apellido')})).filter(r=>r.abonado||r.doc||r.sn||r.nombre||r.apellido);
  return {mode:'dm',rows,sheetName,usedFallbackSheet:!pick,noApellido:idx.apellido==null};
}
function readSmartCSV(files){ // files: [{name,text}]
  let header=null; const recs=[]; const per=[];
  for(const f of files){ const t=parseCSV(f.text); if(t.length<2){per.push(`${f.name}: sin filas`);continue;} const hd=t[0].map(x=>x.trim());
    if(!header)header=hd; const map=hd.map(x=>header.indexOf(x));
    for(const r of t.slice(1)){ const o=new Array(header.length).fill(''); r.forEach((v,i)=>{ if(map[i]>=0)o[map[i]]=v; }); recs.push(o); }
    per.push(`${f.name}: ${t.length-1} equipos`); }
  if(!header)return {error:'El CSV de SmartOLT está vacío.'};
  const hi=n=>header.findIndex(x=>norm(x)===norm(n));
  const iSN=hi('SN'), iName=hi('Name'), iExt=hi('ONU external ID');
  if(iSN<0||iName<0)return {error:'El CSV no trae las columnas "SN" y "Name". Use el archivo de SmartOLT → Reports → Export, sin abrirlo ni modificarlo.'};
  return {header,recs,iSN,iName,iExt,iZone:hi('Zone'),iAddr:hi('Address'),iOlt:hi('OLT'),per,names:files.map(f=>f.name)};
}
function prepareRows(data){
  const valid=[], observed=[];
  if(data.mode==='nn'){
    const bySn=new Map();
    data.rows.forEach(r=>{ const k=upper(r.sn); if(!k){observed.push({...r,abonado:'',doc:'',nombre:'',apellido:'',obs:'SIN SERIAL (ONU SN)'});return;} if(!r.newName){observed.push({...r,abonado:'',doc:'',nombre:'',apellido:'',obs:'NEW NAME VACÍO'});return;} if(!bySn.has(k))bySn.set(k,[]); bySn.get(k).push(r); });
    bySn.forEach(list=>{ const names=new Set(list.map(x=>normaliza(x.newName)));
      if(names.size>1)list.forEach(x=>observed.push({...x,abonado:'',doc:'',nombre:x.newName,apellido:'',obs:'SERIAL REPETIDO CON NOMBRES DISTINTOS'}));
      else valid.push({sn:list[0].sn,newName:normaliza(list[0].newName),abonado:'',doc:'',nombre:''}); });
    return {valid,observed};
  }
  const docRows=new Map(), snCount=new Map();
  data.rows.forEach(r=>{ if(r.doc){ if(!docRows.has(r.doc))docRows.set(r.doc,[]); docRows.get(r.doc).push(r);} const k=upper(r.sn); if(k)snCount.set(k,(snCount.get(k)||0)+1); });
  data.rows.forEach(r=>{ let obs='';
    if(!r.doc) obs='SIN DOCUMENTO';
    else { const same=docRows.get(r.doc); const mism=same.filter(x=>upper(x.sn)===upper(r.sn)&&r.sn).length;
      if(mism>1)obs='DUPLICADO DOCUMENTO Y EQUIPO'; else if(same.length>1&&!r.sn)obs='DUPLICADO DOCUMENTO - SIN EQUIPO'; }
    if(!obs&&!r.sn)obs='FALTANTE EQUIPO';
    if(!obs&&snCount.get(upper(r.sn))>1)obs='SERIAL REPETIDO EN OTRO ABONADO';
    if(obs){observed.push({...r,obs});return;}
    const nombre=cleanName(`${r.nombre} ${r.apellido}`), ab=cleanName(r.abonado), dc=cleanName(r.doc);
    valid.push({sn:r.sn,newName:normaliza(`${ab} - ${dc} - ${nombre}`),abonado:ab,doc:dc,nombre}); });
  return {valid,observed};
}
function processMigration(csv, data){
  const {valid,observed}=prepareRows(data);
  const snMap=new Map(); // cruce solo por la columna SN del CSV, igual que la macro
  csv.recs.forEach((r,i)=>{ const k=upper(r[csv.iSN]); if(k&&!snMap.has(k))snMap.set(k,i); });
  const newName=new Map(), matched=[], notFound=[];
  valid.forEach(r=>{ const ix=snMap.get(upper(r.sn));
    if(ix==null){ notFound.push({...r,apellido:''}); return; }
    newName.set(ix,r.newName); const rec=csv.recs[ix];
    matched.push({sn:r.sn,abonado:r.abonado,nombre:r.nombre,doc:r.doc,zona:csv.iZone>=0?rec[csv.iZone]:'',addr:csv.iAddr>=0?rec[csv.iAddr]:'',olt:csv.iOlt>=0?rec[csv.iOlt]:'',oldName:rec[csv.iName],newName:r.newName}); });
  const lines=[csv.header.map(outField).join(',')];
  csv.recs.forEach((r,i)=>{ if(!newName.has(i))return; lines.push(r.map((v,j)=>outField(j===csv.iName?newName.get(i):v)).join(',')); });
  return {valid,observed,notFound,matched,csvText:lines.join('\n')+'\n',total:data.rows.length,csvTotal:csv.recs.length,untouched:csv.recs.length-newName.size,mode:data.mode};
}

  const skip=h('input',{type:'checkbox',id:'mig-skip',style:'width:auto'}); skip.checked=m.skip;
  const drawOut=()=>{

function browserSave(filename,data){ // respaldo cuando la página se abre como archivo local o fuera de claude.ai
  const blob=data instanceof Blob?data:new Blob([data]); const url=URL.createObjectURL(blob);
  const a=h('a',{href:url,download:filename,style:'display:none'}); document.body.append(a); a.click();

const X={navy:'FF0D2B52',navy2:'FF16406F',blue:'FF1F6FC4',soft:'FFE2EFFB',line:'FFE2E8F0',ink:'FF1C2B3A',muted:'FF6B7C8F',sky:'FF8FC4E8'};
const XF='Calibri';

function sheetBase(wb,name,ncols,opts={}){
  const ws=wb.addWorksheet(name,{views:[{showGridLines:false,...(opts.freeze?{state:'frozen',ySplit:opts.freeze}:{})}],properties:{tabColor:{argb:X.navy}},
    pageSetup:{orientation:'landscape',paperSize:9,fitToPage:true,fitToWidth:1,fitToHeight:0,margins:{left:.4,right:.4,top:.5,bottom:.6,header:.3,footer:.3}},

  if(wb.__logo!==null) ws.addImage(wb.__logo,{tl:{col:0.12,row:0.1},ext:{width:46,height:46}});
  return ws;
}
function sheetTable(wb,name,headers,rows,widths){
  const ws=sheetBase(wb,name,headers.length,{freeze:5});
  const hr=ws.getRow(5); hr.values=headers; hr.height=26;
  hr.eachCell({includeEmpty:true},(c,i)=>{ if(i<=headers.length){ c.fill=fillOf(X.navy2); c.font={name:XF,size:10.5,bold:true,color:{argb:'FFFFFFFF'}}; c.alignment={vertical:'middle',wrapText:true,horizontal:'left',indent:1}; } });
  rows.forEach(r=>{ const row=ws.addRow(r); row.eachCell({includeEmpty:true},(c,i)=>{ if(i<=headers.length){ c.font={name:XF,size:10.5,color:{argb:X.ink}}; c.alignment={vertical:'middle',wrapText:true,horizontal:'left',indent:1}; c.border=bottomLine; } }); });
  ws.columns.forEach((c,i)=>{ let w=headers[i]?String(headers[i]).length+4:10; if(widths&&widths[i]){c.width=widths[i];return;} for(const r of rows.slice(0,300)){ const v=r[i]; if(v!=null)w=Math.max(w,String(v).length+3); } c.width=Math.min(Math.max(w,12),60); });
  if(rows.length)ws.autoFilter={from:{row:5,column:1},to:{row:5,column:headers.length}};
  return ws;
}
function sheetKV(wb,name,sections){
  const ws=sheetBase(wb,name,2,{});

      x.getCell(1).border=bottomLine; x.getCell(2).border=bottomLine; }); });
  return ws;
}

const MIME_D='application/vnd.openxmlformats-officedocument.wordprocessingml.document';
function uniq(a){ return [...new Set(a.map(x=>String(x||'').trim()).filter(Boolean))]; }
function joinOlt(a){ const u=uniq(a); return u.length<=1?(u[0]||''):S.olts.map((o,i)=>`OLT ${i+1}: ${String(a[i]||'').trim()}`).join('  |  '); }
async function buildActa(){
  const zip=await JSZip.loadAsync(ACTA_B64,{base64:true});
  const xml=await zip.file('word/document.xml').async('string');
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const e=S.empresa,l=S.licencia;
  const fv=(fn,na)=>{ const fs=franquicias(); let vals=fs.map(f=>String(fn(pfOf(f))??'').trim()); if(na)vals=vals.map(v=>v||'N/A'); return new Set(vals).size<=1?(vals[0]||''):fs.map((f,i)=>`${f}: ${vals[i]||'N/A'}`).join('  |  '); };
  const vals={ 'Nombre de la empresa':e.nombre,'Líder cabecera':e.lider,'Teléfono':e.telefono,'Cargo':e.cargo,'Correo':e.correo,
    'Marca':uniq(S.olts.map(o=>o.marca)).join(' / '),'Modelo':joinOlt(S.olts.map(o=>o.modelo)),'Dominio':joinOlt(S.olts.map(o=>o.dominio)),'Api Key':joinOlt(S.olts.map(o=>o.apikey)),
    'Nombre Franquicia':franquicias().join(', '),'OLT Software versión':joinOlt(S.olts.map(o=>o.version)),
    'Prorrateo Instalación':fv(q=>q.prInst),'Prorrateo Corte':fv(q=>q.prCorte),'Prorrateo Reconexión':fv(q=>q.prRecon),'Tipos de servicio a integrar':fv(q=>q.tipoServ),
    'Reconexión automática por pago':fv(q=>q.reconAuto),'Mensaje emergente para cobradores':fv(q=>q.msg),'Monto mínimo de reconexión':fv(q=>q.montoMin),'Monto reconexión por porcentaje':fv(q=>q.montoPct),
    'Valor del monto mínimo':fv(q=>money(q.valorMin),true),'Valor de la reconexión en Orden':fv(q=>money(q.reconValor),true),'Aplica reconexión para tipos de servicio':fv(q=>/^IGUAL/.test(q.reconAplica)?q.tipoServ:q.reconAplica),'Aplica en CORTE o RECONEXION el cobro':fv(q=>q.cobroEn),
    'Manejo licencia por SAEPLUS':l.saeplusDominio,'Cantidad OLTs':String(S.olts.length)};
  for(let i=1;i<=5;i++) vals['Nombre OLT '+i]=S.olts[i-1]?S.olts[i-1].nombre:'N/A';
  const norm=t=>t.replace(/\s+/g,' ').replace(/:$/,'').trim().toLowerCase();
  const map=new Map(Object.entries(vals).map(([k,v])=>[norm(k),v]));
  const q=(el,n)=>[...el.getElementsByTagNameNS(W,n)];
  for(const tr of q(doc,'tr')){
    const tcs=[...tr.childNodes].filter(n=>n.localName==='tc'); if(tcs.length<2) continue;
    const label=norm(q(tcs[0],'t').map(t=>t.textContent).join('')); if(!map.has(label)) continue;
    const v=map.get(label); if(v==null||String(v).trim()==='') continue;
    const para=q(tcs[1],'p')[0]; if(!para) continue;
    const ppr=[...para.childNodes].find(n=>n.localName==='pPr'); const rpr=ppr&&[...ppr.childNodes].find(n=>n.localName==='rPr');
    const r=doc.createElementNS(W,'w:r'); if(rpr) r.appendChild(rpr.cloneNode(true));
    const t=doc.createElementNS(W,'w:t'); t.setAttribute('xml:space','preserve'); t.textContent=String(v); r.appendChild(t); para.appendChild(r);
  }
  const firmas={'Analista integraciones':e.analista,'Lider cabecera.':e.lider,'Cargo cliente.':e.cargo};
  for(const para of q(doc,'p')){ const ts=q(para,'t'), txt=ts.map(t=>t.textContent).join('').trim(); if(Object.prototype.hasOwnProperty.call(firmas,txt)&&String(firmas[txt]||'').trim()){ ts[0].textContent=String(firmas[txt]).trim(); ts.slice(1).forEach(t=>t.textContent=''); } }
  for(const t of q(doc,'t')){ if(t.textContent==='Carlos Castillo')t.textContent='Francisco Jimenez'; else if(t.textContent==='Gerente de operaciones')t.textContent='Coordinador de integraciones'; }
  zip.file('word/document.xml',new XMLSerializer().serializeToString(doc));
  return await zip.generateAsync({type:'blob',mimeType:MIME_D,compression:'DEFLATE'});
}

/* ============ envío por correo (Gmail del usuario vía conector) ============ */
const DEST_EMAIL=''; // destino cuando se envía con Gmail desde claude.ai
const APPS_URL=(window.APP_CONFIG&&window.APP_CONFIG.url)||''; // viene de config.js (versión GitHub). Si está vacía se usa Gmail de claude.ai
const APPS_TOKEN=(window.APP_CONFIG&&window.APP_CONFIG.token)||''; // debe ser igual al TOKEN de Code.gs
async function sendViaScript(meta,files){
  const logo=(document.querySelector('header.top img')?.src||'').split(',')[1]||'';
  const payload={token:APPS_TOKEN,empresa:meta.empresa,resumen:meta.resumen,logo,files:await Promise.all(files.map(async f=>({name:f.name,type:f.type,b64:await blobB64(f.blob)})))};
  let res; try{ res=await fetch(APPS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)}); }
  catch(e){ throw {code:'script_net',message:'sin conexión con el servicio de envío'}; }
  let j=null; try{ j=await res.json(); }catch(e){}
  if(!j||!j.ok) throw {code:'script_fail',message:(j&&j.error)||'respuesta inesperada'};
}
function blobB64(blob){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(String(fr.result).split(',')[1]||''); fr.onerror=()=>rej(fr.error); fr.readAsDataURL(blob); }); }
const MIME_X='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
async function sendFiles(to,subject,body,files){
  const mcp=await window.claude?.use?.('mcp').catch(()=>null);
  if(!mcp) throw {code:'no_mcp',message:'Esta vista no permite enviar correos. Abra la página en claude.ai.'};
  let fileArgs=false; try{ fileArgs=!!(await mcp.listTools()).fileArgs; }catch(e){}
  const LIM=850*1024, inline=[], big=[]; let tot=0;
  for(const f of files){ const sz=f.blob.size*4/3; if(tot+sz<=LIM){ tot+=sz; inline.push(f); } else big.push(f); }
  const msgs=[]; // cada mensaje: archivos en línea o 1 archivo grande por la ruta de archivos
  if(inline.length) msgs.push({files:inline});
  big.forEach(f=>msgs.push({files:[f],large:true}));
  if(big.length&&!fileArgs) throw {code:'too_big',message:'Los archivos son muy grandes para enviarlos por correo desde aquí. Use las descargas y adjúntelos manualmente.'};
  const total=msgs.length;
  for(let i=0;i<total;i++){
    const m=msgs[i], atts=[];
    for(const f of m.files) atts.push({filename:f.name,mimeType:f.type,content:m.large?{$file:{data:f.blob,name:f.name,type:f.type}}:await blobB64(f.blob)});
    await mcp.callTool('Gmail','send_message',{to,subject:total>1?`${subject} (${i+1}/${total})`:subject,body:i===0?body:body+'\n\n(Continuación: archivo adjunto adicional.)',attachments:atts});
  }
  return total;
}
function finalCard(e,r,base){
  const st=h('div',{class:'hint',role:'status',style:'margin-top:10px;text-align:center'});
  const btn=h('button',{type:'button',class:'btn go'},'Finalizar y enviar');
  btn.onclick=async()=>{
    btn.disabled=true; st.className='hint'; st.textContent='Enviando…';
    let files=[];
    try{
      files=[{name:`Configurador SmartOLT - ${base}.xlsx`,type:MIME_X,blob:await buildConfigurador()}];
      files.push({name:`Alcance integración SmartOLT - ${base}.docx`,type:MIME_D,blob:await buildActa()});
      if(r) files.push({name:csvOutName(r),type:'text/csv',blob:new Blob([r.csvText],{type:'text/csv'})});
      if(r&&(r.observed.length||r.notFound.length)) files.push({name:`Equipos observados - ${base}.xlsx`,type:MIME_X,blob:await buildObservados()});
      const body=`Configuración de la integración SaePLUS – SmartOLT terminada.\n\nEmpresa: ${e.nombre} (${e.pais})\nContacto: ${e.lider}\nOLTs: ${S.olts.length} (${S.olts.map(o=>o.nombre).join(', ')})\nFranquicias: ${franquicias().join(', ')}\nEquipos para renombrar en SmartOLT: ${r?r.matched.length:'sin migración por ahora'}\n\nAdjuntos:\n`+files.map(f=>'- '+f.name).join('\n');
      if(/^https:\/\//.test(APPS_URL)){ const meta={empresa:e.nombre,resumen:[['Empresa',`${e.nombre} (${e.pais})`],['Contacto',`${e.lider} · ${e.cargo}`],['Analista SaePLUS',e.analista],['OLTs',`${S.olts.length}: ${S.olts.map(o=>`${o.marca} ${o.modelo} - ${o.nombre}`).join(', ')}`],['Franquicias',franquicias().join(', ')],['Servicios',svResumen().replace(/^Franquicias: /,'')],['Barrios',barriosResumen()],['Equipos para renombrar',r?String(r.matched.length):'Sin migración por ahora']]}; await sendViaScript(meta,files); }
      else await sendFiles([DEST_EMAIL],`Configurador integración SmartOLT - ${e.nombre}`,body,files);
      st.className='hint ok'; st.textContent='✓ Enviado'; toast('Correo enviado.');
    }catch(err){
      const c=err&&err.code;
      if(c==='no_mcp'||c==='too_big'){ files.forEach(f=>browserSave(f.name,f.blob)); st.className='hint bad'; st.textContent=c==='no_mcp'?(/^https?:$/.test(location.protocol)&&!/claude\.ai$/.test(location.hostname)?'Falta configurar el envío: config.js no se cargó o no tiene la URL de Apps Script. Se descargaron los archivos.':'Esta copia no puede enviar correos: ábrala desde el enlace en claude.ai. Se descargaron los archivos.'):'Los archivos pesan demasiado para enviarlos desde aquí; se descargaron para adjuntarlos a mano.'; }
      else { const m={server_not_connected:'Conecte Gmail en claude.ai → Conectores y vuelva a intentar.',needs_reauth:'Reconecte Gmail en claude.ai → Conectores.',not_in_manifest:'Falta el permiso de Gmail. Vuelva a pulsar y acepte.',blocked_by_policy:'Su organización bloquea el envío de correos.',cancelled:'Envío cancelado.',script_net:'No hay conexión con el servicio de envío. Revise internet e intente de nuevo.',script_fail:'El servicio de envío rechazó la solicitud. Avise al administrador.'}[c];
        st.className='hint bad'; st.textContent=m||'No se pudo enviar. Intente de nuevo.'; }
    }finally{ btn.disabled=false; }
  };
  return h('div',{style:'margin:28px 0 8px'},btn,st);
}

function rFinal(){
  const e=S.empresa, r=S.migr.res&&!S.migr.res.error&&!S.migr.skip?S.migr.res:null, base=safeName(e.nombre);
  const mk=(title,desc,label,fn)=>{ const b=h('button',{type:'button',class:'btn primary',onclick:async()=>{ b.disabled=true; try{ await fn(); }finally{ b.disabled=false; } }},label); return h('div',{class:'dl'},h('div',null,h('strong',null,title),h('span',null,desc)),b); };
  const ck=(t)=>h('li',null,h('span',{class:'tick'},'✓'),t);
  return [
    h('p',{class:'lead'},'Todo está completo. Revise el resumen y pulse Finalizar y enviar al final de la página.'),
    h('ul',{class:'check'},
      ck(`${e.nombre} · ${e.pais} · contacto: ${e.lider}`),
      ck(`${S.olts.length} OLT: ${S.olts.map(o=>`${o.marca} ${o.modelo} (${o.nombre})`).join(', ')}`),
      ck(svResumen()),
      ck(`Barrios: ${barriosResumen()}`),
      ck(`${S.ordenes.length} órdenes de servicio y ${planUnicos().length} ${planUnicos().length===1?'plan comercial':'planes comerciales'}`),
      ck(r?`${r.matched.length.toLocaleString('es-CO')} equipos listos para renombrar en SmartOLT`:'Sin migración de equipos por ahora')),
    h('h3',{style:'margin:24px 0 8px;font-size:1.05rem'},'Descargas'),
    mk('Acta de alcance de la integración','Documento Word (Alcance integración SmartOLT) con los datos de la empresa y los parámetros ya diligenciados.','Descargar Word',async()=>{ await saveFile(`Alcance integración SmartOLT - ${base}.docx`,await buildActa()); }),
    mk('Configurador de la integración','Excel con todo lo que se configura en SaePLUS y SmartOLT: empresa, OLTs, órdenes, planes, wizard, barrios'+(r?', equipos, backup del CSV y checklist.':' y checklist.'),'Descargar Excel',async()=>{ const b=await buildConfigurador(); await saveFile(`Configurador SmartOLT - ${base}.xlsx`,b); }),
    r?mk('CSV para actualizar el NAME en SmartOLT',`${r.matched.length.toLocaleString('es-CO')} ONUs con el nombre nuevo. Solo cambia la columna Name; el resto queda igual que el export. No lo abra ni lo guarde en Excel.`,'Descargar CSV',()=>saveFile(csvOutName(r),new Blob([r.csvText],{type:'text/csv'}))):null,
    r&&(r.observed.length||r.notFound.length)?mk('Equipos observados',`${r.observed.length+r.notFound.length} clientes que no entraron al CSV y requieren revisión.`,'Descargar Excel',async()=>{ await saveFile(`Equipos observados - ${base}.xlsx`,await buildObservados()); }):null,
    h('h3',{style:'margin:24px 0 8px;font-size:1.05rem'},'Qué sigue'),
    h('ol',{class:'steps'},
      h('li',null,h('b',null,'Configurar SaePLUS '),'con las hojas del Excel, en el orden del checklist: tipos de servicio, órdenes, servicios y wizard de integración.'),
      r?h('li',null,h('b',null,'Subir el CSV a SmartOLT: '),'Reports → Import → Examinar → elegir el CSV → Import ONUs location details. Esto cambia todos los nombres.'):null,
      r?h('li',null,h('b',null,'Auditar: '),'descargue el listado de abonados de SaePLUS y un CSV nuevo de SmartOLT para confirmar que todos los clientes cruzan.'):null),
    finalCard(e,r,base)
  ]; }


/* ============ modo claro / oscuro ============ */
(function(){ const btn=document.getElementById('theme-btn'); if(!btn)return;
  const eff=()=>document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const paint=()=>{ btn.textContent=eff()==='dark'?'☀ Modo claro':'☾ Modo oscuro'; };
  try{ const t=localStorage.getItem('cfg_theme'); if(t==='light'||t==='dark')document.documentElement.dataset.theme=t; }catch(e){}
  btn.onclick=()=>{ const n=eff()==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; try{localStorage.setItem('cfg_theme',n);}catch(e){} paint(); };
  try{ matchMedia('(prefers-color-scheme:dark)').addEventListener('change',paint); }catch(e){}
  paint(); })();

/* ============ arranque ============ */
loadDraft(); if(S.step>0&&!unlocked(S.step))S.step=0;
drawAll();
</script>
